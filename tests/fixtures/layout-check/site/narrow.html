<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Narrow overflow</title>
<style>
  body { margin: 0; font: 16px/1.5 sans-serif; }
  main { padding: 16px; }
  .toolbar { min-width: 520px; border: 1px solid #333; }
</style>
</head>
<body>
<main>
  <h1>A toolbar with a minimum width</h1>
  <div class="toolbar">It is wider than a phone, so below about 550px it leaves its parent and the page scrolls sideways.</div>
</main>
</body>
</html>
