<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipped</title>
<style>
  body { margin: 0; font: 16px/1.5 sans-serif; }
  main { padding: 16px; }
  .label { width: 160px; height: 24px; overflow: hidden; border: 1px solid #333; }
  .note { width: 160px; height: 24px; border: 1px solid #333; margin-top: 48px; }
</style>
</head>
<body>
<main>
  <h1>Fixed heights</h1>
  <div class="label">This label holds more words than one 24px line can show, so the rest is cut off.</div>
  <div class="note">This note spills out of its 24px box and over whatever comes next.</div>
</main>
</body>
</html>
