<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allowed</title>
<style>
  body { margin: 0; font: 16px/1.5 sans-serif; }
  main { padding: 16px; }
  .card { position: relative; border: 1px solid #333; padding: 12px; width: 200px; }
  .badge { position: absolute; top: -10px; right: -20px; background: #000; color: #fff; padding: 2px 6px; }
  .log { height: 72px; overflow-y: auto; border: 1px solid #333; width: 200px; }
  .hidden-but-empty { height: 0; overflow: hidden; }
</style>
</head>
<body>
<main>
  <h1>What leaves a box on purpose</h1>
  <div class="card">A card with a badge placed outside its corner.<span class="badge">new</span></div>
  <div class="log">A scrolling log holds more than it shows. line two. line three. line four. line five. line six. line seven.</div>
  <div class="hidden-but-empty"></div>
</main>
</body>
</html>
